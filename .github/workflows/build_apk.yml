name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build_apk:
    name: Build Pre-configured Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs with Supabase secrets
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Prepare named APK files
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/AcuerdoVecinal-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/AcuerdoVecinal-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_apks/AcuerdoVecinal-x86_64.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: acuerdo-vecinal-apks
          path: release_apks/*.apk

      - name: Publish rolling latest GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release_apks/*.apk --clobber
          else
            gh release create latest release_apks/*.apk \
              --title "AcuerdoVecinal APK (Última versión)" \
              --notes "APKs Android compilados automáticamente con conexión Supabase preconfigurada. Instala AcuerdoVecinal-arm64-v8a.apk en celulares Android modernos." \
              --latest
          fi
